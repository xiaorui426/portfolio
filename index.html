<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="孙肖瑞 - UI/UX 设计作品集。4 年互联网 UI/UX 设计经验，专注全链路设计与数据驱动的体验优化。" />
    <meta property="og:title" content="孙肖瑞 · UI/UX 设计作品集" />
    <meta property="og:description" content="4 年互联网 UI/UX 设计经验 · 全链路设计 · 数据驱动设计" />
    <meta property="og:image" content="assets/pages/page-01.jpg" />
    <title>孙肖瑞 · UI/UX 设计作品集</title>
    <style>
      :root { --ink:#f8fbff; --muted:#b9c7d6; --line:rgba(255,255,255,.13); --blue:#58b8ff; --surface:#06111d; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; background:#020810; }
      body { margin:0; color:var(--ink); background:radial-gradient(circle at 16% 0%, #0b3451 0, #071624 27rem, #020810 62rem); font-family:"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; }
      a { color:inherit; text-decoration:none; }
      .topbar { position:fixed; z-index:10; top:0; width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,4vw,4rem); background:linear-gradient(180deg,rgba(2,8,16,.92),rgba(2,8,16,.7) 70%,transparent); backdrop-filter:blur(10px); }
      .brand { font-size:.9rem; font-weight:700; letter-spacing:.08em; }
      .nav { display:flex; gap:.75rem; align-items:center; color:var(--muted); font-size:.86rem; }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:2.4rem; padding:0 .95rem; border:1px solid var(--line); border-radius:999px; transition:.2s ease; }
      .button:hover { transform:translateY(-2px); border-color:var(--blue); background:rgba(88,184,255,.12); color:#fff; }
      .button.primary { color:#02101d; border-color:#b8e3ff; background:#d9f1ff; font-weight:700; }
      .hero { min-height:100svh; display:grid; place-items:center; padding:6.5rem 1rem 2rem; }
      .hero-inner { width:min(1180px,100%); display:grid; grid-template-columns:minmax(0,1.05fr) minmax(19rem,.95fr); overflow:hidden; border:1px solid var(--line); border-radius:1.5rem; background:rgba(7,22,36,.82); box-shadow:0 2rem 7rem rgba(0,0,0,.35); }
      .hero-copy { padding:clamp(2rem,6vw,5rem); align-self:center; }
      .eyebrow { color:#83cbff; font-size:.8rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
      h1 { margin:.9rem 0 1.1rem; font-size:clamp(2.8rem,7vw,6.2rem); line-height:.96; letter-spacing:-.07em; }
      .lead { max-width:30rem; color:var(--muted); font-size:clamp(1rem,1.6vw,1.2rem); line-height:1.7; }
      .actions { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:2rem; }
      .cover { width:100%; height:100%; min-height:28rem; object-fit:cover; object-position:center; }
      main { width:min(1180px,100%); margin:0 auto; padding:4rem 1rem 6rem; }
      .section-heading { display:flex; justify-content:space-between; align-items:end; gap:1rem; margin-bottom:1.5rem; }
      h2 { margin:0; font-size:clamp(1.7rem,4vw,3rem); letter-spacing:-.05em; }
      .section-heading p { margin:0; color:var(--muted); }
      .gallery { display:grid; gap:1rem; }
      .page { overflow:hidden; border:1px solid var(--line); border-radius:1rem; background:var(--surface); box-shadow:0 1.2rem 3rem rgba(0,0,0,.24); }
      .page img { width:100%; display:block; aspect-ratio:1.69/1; object-fit:cover; opacity:0; transform:translateY(14px); transition:opacity .45s ease,transform .45s ease; }
      .page img.ready { opacity:1; transform:none; }
      .footer { padding:2rem 1rem 3rem; color:var(--muted); text-align:center; font-size:.85rem; }
      @media (max-width:700px) { .topbar .brand { font-size:.76rem; } .nav a:first-child { display:none; } .hero-inner { grid-template-columns:1fr; } .hero-copy { order:2; } .cover { min-height:0; max-height:52svh; } .hero { padding-top:4.6rem; } }
      @media (prefers-reduced-motion:reduce) { *,html { scroll-behavior:auto!important; transition:none!important; } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">SUN XIAO RUI / UI·UX</a>
      <nav class="nav" aria-label="页面导航"><a href="#portfolio">作品集</a><a class="button" href="portfolio.pdf" download>下载 PDF</a></nav>
    </header>
    <section class="hero" id="top">
      <div class="hero-inner">
        <div class="hero-copy">
          <div class="eyebrow">Portfolio 2026</div>
          <h1>孙肖瑞<br />UI/UX 设计师</h1>
          <p class="lead">4 年互联网 UI/UX 设计经验，专注全链路设计、跨端体验与数据驱动的产品优化。</p>
          <div class="actions"><a class="button primary" href="#portfolio">浏览作品集 ↓</a><a class="button" href="portfolio.pdf" target="_blank" rel="noopener">在线阅读 PDF ↗</a></div>
        </div>
        <img class="cover" src="assets/pages/page-01.jpg" alt="孙肖瑞 UI/UX 设计作品集封面" />
      </div>
    </section>
    <main id="portfolio">
      <div class="section-heading"><div><div class="eyebrow">Selected work</div><h2>作品集</h2></div><p>共 44 页 · 向下浏览</p></div>
      <div class="gallery" id="gallery" aria-label="孙肖瑞 UI UX 设计作品集页面"></div>
    </main>
    <footer class="footer">© 2026 Sun Xiao Rui · UI/UX Portfolio</footer>
    <script>
      const gallery = document.getElementById('gallery');
      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target; img.src = img.dataset.src; img.onload = () => img.classList.add('ready'); observer.unobserve(img);
      }), { rootMargin: '900px 0px' });
      for (let index = 1; index <= 44; index++) {
        const number = String(index).padStart(2, '0');
        const article = document.createElement('article'); article.className = 'page';
        const image = document.createElement('img'); image.loading = 'lazy'; image.dataset.src = `assets/pages/page-${number}.jpg`; image.alt = `孙肖瑞 UI/UX 设计作品集，第 ${index} 页`;
        article.append(image); gallery.append(article); observer.observe(image);
      }
    </script>
  </body>
</html>
