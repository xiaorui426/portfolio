<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="孙肖瑞 - UI/UX 设计作品集。4 年互联网 UI/UX 设计经验，专注全链路设计与数据驱动的体验优化。" />
    <meta property="og:title" content="孙肖瑞 · UI/UX 设计作品集" />
    <meta property="og:description" content="4 年互联网 UI/UX 设计经验 · 全链路设计 · 数据驱动设计" />
    <meta property="og:image" content="assets/pages/page-01.jpg" />
    <meta name="theme-color" content="#07111c" />
    <title>孙肖瑞 · UI/UX 设计作品集</title>
    <style>
      :root { --ink:#f4f8ff; --muted:#b6c4d4; --line:rgba(234,242,255,.18); --night:#06101a; --blue:#8fcfff; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; background:var(--night); }
      body { margin:0; color:var(--ink); background:var(--night); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      a { color:inherit; text-decoration:none; }
      .hero { min-height:100svh; position:relative; isolation:isolate; display:grid; align-items:end; overflow:hidden; padding:clamp(24px,5vw,76px); }
      .hero::before { content:""; position:absolute; inset:0; z-index:-2; background:linear-gradient(90deg,rgba(2,8,15,.94) 0%,rgba(2,8,15,.58) 39%,rgba(2,8,15,.08) 72%),linear-gradient(0deg,rgba(2,8,15,.74),transparent 58%),url("assets/hero-background.jpg") center / cover no-repeat; }
      .hero::after { content:""; position:absolute; z-index:-1; inset:auto -10% -34% 33%; height:48%; background:radial-gradient(ellipse,rgba(61,142,255,.27),transparent 67%); filter:blur(20px); }
      .nav { position:fixed; z-index:10; top:18px; left:clamp(16px,4vw,56px); right:clamp(16px,4vw,56px); display:flex; justify-content:space-between; align-items:center; gap:18px; min-height:58px; padding:8px 10px 8px 12px; border:1px solid rgba(234,242,255,.2); border-radius:18px; background:rgba(4,12,21,.58); box-shadow:0 12px 32px rgba(0,0,0,.2); backdrop-filter:blur(14px); color:var(--muted); font-size:14px; letter-spacing:.03em; }
      .brand { display:flex; align-items:center; gap:10px; color:white; font-weight:800; }
      .avatar { width:36px; height:36px; border:1px solid rgba(255,255,255,.48); border-radius:50%; object-fit:cover; object-position:center 18%; }
      .nav-actions { display:flex; align-items:center; gap:4px; }
      .nav-actions a, .nav-actions button { padding:10px 13px; border:0; border-radius:11px; background:transparent; color:inherit; font:inherit; font-weight:700; cursor:pointer; transition:background .2s ease,color .2s ease; }
      .nav-actions a:hover, .nav-actions button:hover { background:rgba(143,207,255,.18); color:white; }
      .nav-actions button:disabled { cursor:wait; opacity:.72; }
      .intro { max-width:760px; padding-top:150px; }
      .eyebrow { color:#dceaff; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:16px 0; max-width:700px; font-size:clamp(48px,9vw,120px); line-height:.91; letter-spacing:-.075em; }
      .intro p { max-width:480px; color:var(--muted); font-size:clamp(16px,2vw,20px); line-height:1.65; }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:50px; margin-top:18px; padding:0 22px; border-radius:999px; background:var(--ink); color:#06101a; font-weight:800; transition:transform .2s ease,background .2s ease; }
      .button:hover { transform:translateY(-2px); background:white; }
      .scroll-cue { margin-top:clamp(42px,9vh,98px); color:var(--muted); font-size:13px; letter-spacing:.08em; }
      main { max-width:1280px; margin:0 auto; padding:clamp(64px,10vw,140px) clamp(18px,5vw,76px); }
      .section-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:28px; }
      h2 { margin:0; font-size:clamp(32px,5vw,64px); letter-spacing:-.06em; }
      .section-head p { max-width:340px; margin:0; color:var(--muted); line-height:1.6; }
      .pdf-viewer { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#0b1724; box-shadow:0 22px 70px rgba(0,0,0,.28); }
      .viewer-bar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:13px 16px; background:#111e2e; color:var(--muted); font-size:13px; }
      .viewer-status { margin:0; }
      .viewer-bar button { padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
      .viewer-frame { display:block; width:100%; height:min(82vh,1000px); border:0; background:#fff; }
      footer { border-top:1px solid var(--line); padding:26px clamp(20px,5vw,76px); display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:13px; }
      @media (max-width:640px) { .hero { min-height:730px; padding:24px; } .hero::before { background-position:58% center; } .nav { top:10px; left:10px; right:10px; min-height:52px; padding:6px 7px; border-radius:14px; } .avatar { width:32px; height:32px; } .nav-actions { gap:0; } .nav-actions a, .nav-actions button { padding:9px 8px; font-size:12px; } .intro { padding-top:110px; } .section-head { display:block; } .section-head p { margin-top:12px; } .pdf-viewer { border-radius:10px; } .viewer-frame { height:70vh; } footer { display:block; } footer p + p { margin-top:10px; } }
      @media (prefers-reduced-motion:reduce) { *,html { scroll-behavior:auto!important; transition:none!important; } }
    </style>
  </head>
  <body>
    <header class="hero" id="top">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="#top"><img class="avatar" src="assets/profile/sun-xiaorui.jpg" alt="孙肖瑞头像" /><span>孙肖瑞</span></a>
        <div class="nav-actions"><button id="download-portfolio" type="button">下载作品集</button><a href="assets/downloads/sun-xiaorui-uiux-resume.pdf" download>下载简历</a></div>
      </nav>
      <div class="intro">
        <div class="eyebrow">Design Portfolio / 2026</div>
        <h1>UI/UX<br />设计作品集</h1>
        <p>孙肖瑞的界面与体验设计作品。4 年互联网 UI/UX 设计经验，专注全链路设计、跨端体验与数据驱动的产品优化。</p>
        <a class="button" href="#portfolio">在线浏览作品集 ↓</a>
        <div class="scroll-cue">SCROLL TO EXPLORE ↓</div>
      </div>
    </header>
    <main id="portfolio">
      <div class="section-head"><div><div class="eyebrow">Selected work</div><h2>完整作品集</h2></div><p>原始 PDF · 共 43 页。可在线阅读或下载。</p></div>
      <section class="pdf-viewer" aria-label="孙肖瑞 UI UX 设计作品集 PDF">
        <div class="viewer-bar"><p class="viewer-status" id="viewer-status">正在加载原始 PDF…</p><button id="viewer-download" type="button">下载 PDF</button></div>
        <iframe class="viewer-frame" id="portfolio-frame" title="孙肖瑞 UI UX 设计作品集"></iframe>
      </section>
    </main>
    <footer><p>© 2026 孙肖瑞 · UI/UX Design Portfolio</p><p>Built for job applications &amp; interviews</p></footer>
    <script>
      const portfolioParts = Array.from({ length: 23 }, (_, index) => `assets/downloads/portfolio-parts/part-aa${String.fromCharCode(97 + index)}`);
      let portfolioUrl;
      async function getPortfolioUrl() {
        if (portfolioUrl) return portfolioUrl;
        const buffers = await Promise.all(portfolioParts.map(path => fetch(path).then(response => {
          if (!response.ok) throw new Error(`Unable to fetch ${path}`);
          return response.arrayBuffer();
        })));
        portfolioUrl = URL.createObjectURL(new Blob(buffers, { type: 'application/pdf' }));
        return portfolioUrl;
      }
      async function downloadPortfolio(button) {
        const originalLabel = button.textContent;
        button.disabled = true;
        button.textContent = '正在准备…';
        try {
          const link = document.createElement('a');
          link.href = await getPortfolioUrl();
          link.download = '孙肖瑞UI·UX作品集.pdf';
          link.click();
        } catch (error) {
          button.textContent = '下载失败，请重试';
          setTimeout(() => { button.textContent = originalLabel; }, 1800);
        } finally {
          button.disabled = false;
        }
      }
      const portfolioDownload = document.getElementById('download-portfolio');
      const viewerDownload = document.getElementById('viewer-download');
      portfolioDownload.addEventListener('click', () => downloadPortfolio(portfolioDownload));
      viewerDownload.addEventListener('click', () => downloadPortfolio(viewerDownload));
      const portfolioFrame = document.getElementById('portfolio-frame');
      const viewerStatus = document.getElementById('viewer-status');
      getPortfolioUrl().then(url => {
        portfolioFrame.src = `${url}#view=FitH`;
        portfolioFrame.addEventListener('load', () => { viewerStatus.textContent = '原始 PDF · 共 43 页'; }, { once:true });
      }).catch(() => { viewerStatus.textContent = '加载失败，请点击右侧下载 PDF。'; });
    </script>
  </body>
</html>
